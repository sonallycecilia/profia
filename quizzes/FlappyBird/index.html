<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Flappy Bird Master</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <div class="quiz-card">
        <div id="quiz-screen">
            <div class="header">
                <span class="mascot-icon">🐦</span>
                <h1>Desafio: Flappy Bird</h1>                
                <div class="progress-container">
                    <div class="progress-fill" id="progress"></div>
                </div>
            </div>

            <div class="question-box" id="question-text">
                Carregando sua missão...
            </div>

            <div class="options-grid" id="options-container">
                </div>

            <div class="feedback-area" id="feedback"></div>

            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Próxima Questão ➔</button>
        </div>

        <div id="result-screen" class="result-screen" style="display: none;">
            <span class="mascot-icon">🏆</span>
            <h1>Partida Finalizada!</h1>
            <p>Veja seu desempenho como programador de jogos:</p>
            
            <div class="big-score" id="final-score">0/10</div>
            
            <div class="message-box" id="final-message">
                Calculando seu nível...
            </div>

            <button class="next-btn" style="display:inline-block; background-color: var(--accent-orange); box-shadow: 0 5px 0 #E64A19;" onclick="location.reload()">
                Tentar Novamente 🔄
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
